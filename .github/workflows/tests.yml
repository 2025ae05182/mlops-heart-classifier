name: CI - Unit Tests

on:
  push:
    branches: [ "main" ]
    paths:
      - "**/*.py"
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-html

      - name: Run tests with reports
        run: |
          pytest tests/ \
            --junitxml=report.xml \
            --html=report.html \
            --self-contained-html \
            --maxfail=1 \
            --disable-warnings

      - name: Upload test reports
        uses: actions/upload-artifact@v3
        with:
          name: pytest-reports
          path: |
            report.xml
            report.html

      - name: Publish HTML report in summary
        run: |
          echo "## 🧪 Pytest Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download full report from artifacts above." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "<details><summary>View raw HTML report</summary>" >> $GITHUB_STEP_SUMMARY
          cat report.html >> $GITHUB_STEP_SUMMARY
          echo "</details>" >> $GITHUB_STEP_SUMMARY
